kind: Deployment
apiVersion: apps/v1
metadata:
  name: mysql
  namespace: bank
  labels:
    app: mysql
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: mysql
  template:
    metadata:
      name: mysqlpod
      namespace: mysql
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD   #env variable name
              valueFrom:
                secretKeyRef:
                  name: bankui-secret
                  key: password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name:  bankui-configmap
                  key: databasename
